<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untold Trails: The Path Planner</title>
  <meta name="description" content="Community-powered discovery platform and grounded AI trip planner for lesser-known destinations, regional food, crafts, and village stays." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Telugu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream: 'var(--ut-bg)',
            sand: 'var(--ut-surface-alt)',
            terracotta: '#C84B31',
            terracottaDark: '#A33822',
            forest: '#164A37',
            forestLight: '#21664D',
            ochre: '#C9821E',
            espresso: 'var(--ut-ink)',
            muted: 'var(--ut-muted)',
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            telugu: ['Noto Sans Telugu', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-cream text-espresso font-sans antialiased selection:bg-terracotta/15 selection:text-espresso min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col">
    <div class="flex-1 flex items-center justify-center p-12 text-sm text-muted">
      Loading Untold Trails…
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[1100] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
